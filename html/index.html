<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Movie Explorer</title>
</head>
<body>
    <header class="nav">
        <a class="logo" href="#">CINEBOOK</a>
        <nav>
        <a class="active" href="#">Home</a>
        <a href="#">Now showing</a>
        <a href="account.html">Account</a>
        </nav>
    </header>

    <section class="hero" id="hero">
        <div class="hero-info">
        <p class="meta"><span class="rating" id="hero-rating"></span><span id="hero-year"></span></p>
        <h1 id="hero-title">Loading…</h1>
        <p id="hero-overview"></p>
        <div class="actions">
            <button class="btn primary" id="hero-book">Book tickets</button>
            <button class="btn ghost" id="hero-save">Add to list</button>
        </div>
        </div>
    </section>

    <section class="tabs" id="tabs">
        <button class="tab active" data-list="trending/movie/week">Trending</button>
        <button class="tab" data-list="movie/popular">Popular</button>
        <button class="tab" data-list="movie/now_playing">Now playing</button>
        <button class="tab" data-list="movie/upcoming">Upcoming</button>
    </section>

    <section class="chips" id="chips"></section>

    <main class="row" id="row"></main>
    <p class="status" id="status"></p>


<dialog id="booking-dialog" class="booking-dialog">
  <form id="booking-form">
    <h2 id="booking-title">Book Movie</h2>
    <p>Select your demo booking details.</p>

    <label for="booking-date">Date</label>
    <input type="date" id="booking-date" required>

    <label for="booking-time">Showtime</label>
    <select id="booking-time" required>
      <option value="10:00">10:00 AM</option>
      <option value="14:00">2:00 PM</option>
      <option value="18:00">6:00 PM</option>
      <option value="21:00">9:00 PM</option>
    </select>

    <label for="booking-quantity">Number of Tickets</label>
    <input
      type="number"
      id="booking-quantity"
      min="1"
      max="6"
      value="1"
      required
    >

    <div class="booking-actions">
      <button type="button" id="cancel-booking">
        Cancel
      </button>

      <button type="submit" id="confirm-booking">
        Confirm Booking
      </button>
    </div>
  </form>
</dialog>


    <script type="module" src="../js/script.js"></script>
    <script type="module" src="../api/tmdb.js"></script>
</body>
</html>
